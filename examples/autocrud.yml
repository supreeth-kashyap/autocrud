database: sqlite:///dev.db
models_module: examples.demo_app.models
expose:
  models:
    User: [list, get, create]
    Order: [list, get]
  functions:
    - get_active_users
    - greet
# No key is committed here: export AUTOCRUD_API_KEY before serving this example.
security: {}
rate_limit:
  requests_per_minute: 100
